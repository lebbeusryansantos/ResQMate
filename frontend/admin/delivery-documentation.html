<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Documentation</title>

    <link rel="stylesheet" href="../style/customer-sidebar.css">
    <link rel="stylesheet" href="../style/admin-shared.css">
    <link rel="stylesheet" href="../style/admin-documentation.css">
    <link rel="stylesheet" href="../style/logout-modal.css">
    <link rel="stylesheet" href="../style/profile-modal.css">


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <div class="dashboard-container">

        <div id="sidebar-container"></div>
        <div id="logout-modal-wrapper"></div>
        <div id="profile-modal-wrapper"></div>

        <!-- MAIN CONTENT -->
        <main class="main-content">

            <!-- TOPBAR -->
            <div class="topbar">
                <h2>Delivery Documentation</h2>
                <p>Review submitted proof of delivery from staff members.</p>
            </div>

            <!-- TABLE -->
            <div class="table-card">

                <div class="toolbar-row">
                    <h5 class="section-title">
                        Submitted Documentation
                    </h5>
                    <div class="toolbar-actions">
                        <div class="search-box">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input type="text" id="docSearch" placeholder="Search documentation...">
                        </div>
                        <select id="statusFilter" class="rq-input" aria-label="Filter by Status">
                            <option value="all">All Status</option>
                            <option value="pending">Pending</option>
                            <option value="approved">Approved</option>
                            <option value="rejected">Rejected</option>
                        </select>
                    </div>
                </div>

                <div class="table-responsive">

                    <table class="table" id="documentationTable">

                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Request ID</th>
                                <th>Staff</th>
                                <th>Remarks</th>
                                <th>Proof</th>
                                <th>Status</th>
                                <th>Submitted</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="documentationTableBody">
                        </tbody>

                    </table>

                </div>

            </div>

          <button id="backToTopBtn" title="Go to top"><i class="fa-solid fa-arrow-up"></i></button>
    </main>

    </div>

    <div class="modal-overlay" id="remarksModal">

        <div class="modal-content">

            <div class="modal-header">
                <h3>Documentation Remarks</h3>

                <button id="closeRemarksModal">
                    &times;
                </button>
            </div>

            <div class="modal-body">
                <p id="remarksContent"></p>
            </div>

        </div>

    </div>

    <!-- REJECTION MODAL -->
    <div class="modal" id="rejectionModal">
        <div class="modal-content request-modal-card rejection-card">
            <div class="request-modal-header">
                <div>
                    <h4>Reject</h4>
                    <p>Select a reason for rejection</p>
                </div>
                <button id="closeRejectionModal" aria-label="Close Rejection Modal">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="request-details rejection-details">
                <form id="rejectionForm">
                    <div class="form-group rejection-group">
                        <label for="rejectionReasonSelect" class="rejection-label">Rejection Reason</label>
                        <select id="rejectionReasonSelect" class="rq-input rejection-input" required>
                            <option value="" disabled selected>Select a reason...</option>
                            <option value="Invalid Location">Invalid Location</option>
                            <option value="Duplicate Request">Duplicate Request</option>
                            <option value="Spam/Fake Request">Spam/Fake Request</option>
                            <option value="Incomplete Documentation">Incomplete Documentation</option>
                            <option value="Others">Others (Please specify)</option>
                        </select>
                    </div>
                    <div class="form-group d-none rejection-group" id="otherReasonContainer">
                        <label for="otherRejectionReason" class="rejection-label">Specify Reason</label>
                        <input type="text" id="otherRejectionReason" class="rq-input rejection-input" placeholder="Enter reason here...">
                    </div>
                    <div class="rejection-actions">
                        <button type="button" class="btn-secondary rejection-cancel-btn" id="cancelRejectionBtn">Cancel</button>
                        <button type="submit" class="rq-btn-reject rejection-submit-btn" id="submitRejectionBtn">Reject</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../components/profile-modal.js"></script>
    <script src="../components/loadAdminSidebar.js"></script>
    <script src="../components/logout-modal.js"></script>
    <script src="../js/admin-documentation.js"></script>

  <script src="../components/back-to-top.js"></script>
</body>

</html>
