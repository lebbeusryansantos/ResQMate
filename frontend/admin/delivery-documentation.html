<!-- Main structure and layout for delivery-documentation -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Documentation</title>

    <link rel="stylesheet" href="../style/customer-sidebar.css">
    <link rel="stylesheet" href="../style/admin-shared.css">
    <link rel="stylesheet" href="../style/admin-documentation.css">
    <link rel="stylesheet" href="../style/logout-modal.css">
    <link rel="stylesheet" href="../style/profile-modal.css">


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <div class="dashboard-container">

        <div id="sidebar-container"></div>
        <div id="logout-modal-wrapper"></div>
        <div id="profile-modal-wrapper"></div>

        <!-- MAIN CONTENT -->
        <!-- Main Content Section -->
<main class="main-content">

            <div class="rq-topbar">
                <h4>Delivery Documentation</h4>
                <small>
                    Review submitted proof of delivery from staff members.
                </small>
            </div>

            <div class="rq-card">

                <div class="table-responsive">

                    <!-- Data Table Section -->
<table class="table">

                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Request ID</th>
                                <th>Staff</th>
                                <th>Remarks</th>
                                <th>Proof</th>
                                <th>Status</th>
                                <th>Submitted</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="documentationTableBody">
                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>

    <!-- Modal UI Component -->
<div class="modal-overlay" id="remarksModal">

        <!-- Modal UI Component -->
<div class="modal-content">

            <!-- Modal UI Component -->
<div class="modal-header">
                <h3>Documentation Remarks</h3>

                <button id="closeRemarksModal">
                    &times;
                </button>
            </div>

            <!-- Modal UI Component -->
<div class="modal-body">
                <p id="remarksContent"></p>
            </div>

        </div>

    </div>

    <!-- REJECTION MODAL -->
    <!-- Modal UI Component -->
<div class="modal" id="rejectionModal">
        <!-- Modal UI Component -->
<div class="modal-content request-modal-card" style="max-width: 400px;">
            <!-- Modal UI Component -->
<div class="request-modal-header">
                <div>
                    <h4>Reject</h4>
                    <p>Select a reason for rejection</p>
                </div>
                <button id="closeRejectionModal" aria-label="Close Rejection Modal">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="request-details" style="padding: 20px;">
                <form id="rejectionForm">
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label for="rejectionReasonSelect" style="display:block; margin-bottom: 5px; font-weight:500;">Rejection Reason</label>
                        <select id="rejectionReasonSelect" class="rq-input" required style="width: 100%; padding: 10px;">
                            <option value="" disabled selected>Select a reason...</option>
                            <option value="Invalid Location">Invalid Location</option>
                            <option value="Duplicate Request">Duplicate Request</option>
                            <option value="Spam/Fake Request">Spam/Fake Request</option>
                            <option value="Incomplete Documentation">Incomplete Documentation</option>
                            <option value="Others">Others (Please specify)</option>
                        </select>
                    </div>
                    <div class="form-group" id="otherReasonContainer" style="display: none; margin-bottom: 15px;">
                        <label for="otherRejectionReason" style="display:block; margin-bottom: 5px; font-weight:500;">Specify Reason</label>
                        <input type="text" id="otherRejectionReason" class="rq-input" placeholder="Enter reason here..." style="width: 100%; padding: 10px;">
                    </div>
                    <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                        <button type="button" class="btn-secondary" id="cancelRejectionBtn" style="padding: 8px 16px; border-radius: 6px; border: none; background: #e2e8f0; cursor: pointer;">Cancel</button>
                        <button type="submit" class="rq-btn-reject" id="submitRejectionBtn" style="padding: 8px 16px; border-radius: 6px; border: none; background: #ef4444; color: white; cursor: pointer;">Reject</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../components/profile-modal.js"></script>
    <script src="../components/loadAdminSidebar.js"></script>
    <script src="../components/logout-modal.js"></script>
    <script src="../js/admin-documentation.js"></script>

</body>

</html>
