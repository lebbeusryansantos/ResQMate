<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResQMate – Distributions</title>

    <link rel="stylesheet" href="../style/customer-sidebar.css">
    <link rel="stylesheet" href="../style/admin-shared.css">
    <link rel="stylesheet" href="../style/logout-modal.css">
    <link rel="stylesheet" href="../style/profile-modal.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <div class="dashboard-container">

        <div id="sidebar-container"></div>
        <div id="logout-modal-wrapper"></div>
        <div id="profile-modal-wrapper"></div>

        <main class="main-content">

            <!-- TOPBAR -->

            <div class="topbar">
                <h2>Distributions</h2>
                <p>Manage relief aid deliveries and resource distribution</p>
            </div>

            <!-- TABLE -->

            <div class="table-card">

                <div class="toolbar-row">

                    <h5 class="section-title">
                        Distribution Records
                    </h5>

                    <div class="toolbar-actions">

                        <div class="search-box">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input type="text" id="distributionSearch" placeholder="Search distributions...">
                        </div>

                        <select id="statusFilter" class="rq-input" aria-label="Filter by Status">

                            <option value="all">
                                All Status
                            </option>

                            <option value="preparing">
                                Preparing
                            </option>

                            <option value="in_transit">
                                In Transit
                            </option>

                            <option value="delivered">
                                Delivered
                            </option>

                            <option value="cancelled">
                                Cancelled
                            </option>

                        </select>

                        <button class="btn-primary" id="addDistributionBtn">

                            <i class="fa-solid fa-plus"></i>
                            Create Distribution

                        </button>

                    </div>

                </div>

                <div class="table-responsive">

                    <table id="distributionTable">

                        <thead>

                            <tr>
                                <th>ID</th>
                                <th>Request ID</th>
                                <th>Recipient</th>
                                <th>Resource</th>
                                <th>Quantity</th>
                                <th>Staff ID</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>

                        </thead>

                        <tbody>

                            <!-- Loaded by JS -->

                        </tbody>

                    </table>

                </div>

            </div>

          <button id="backToTopBtn" title="Go to top"><i class="fa-solid fa-arrow-up"></i></button>
    </main>

    </div>

    <!-- CREATE / EDIT MODAL -->

    <div class="modal" id="distributionModal">

        <div class="modal-content">

            <div class="modal-header-row">

                <h4 id="distributionModalTitle">
                    Create Distribution
                </h4>

            </div>

            <div class="form-group">

                <label for="requestId">Request ID <span class="required-asterisk">*</span></label>

                <select id="requestId" required>
                    <option value="">Select Request ID</option>
                </select>

            </div>

            <div class="form-group">
                <label for="resource">Resource <span class="required-asterisk">*</span></label>
                <select id="resource" required>
                    <option value="">Select Resource</option>
                </select>
            </div>

            <div class="form-group">

                <label for="quantity">Quantity Given <span class="required-asterisk">*</span></label>

                <input type="number" id="quantity" required>

            </div>

            <div class="form-group">
                <label for="staff">Staff <span class="required-asterisk">*</span></label>
                <select id="staff" required>
                    <option value="">Select Staff</option>
                </select>
            </div>

            <div class="modal-footer">

                <button type="button" class="btn-secondary" id="cancelDistribution">

                    Cancel

                </button>

                <button type="button" class="btn-primary" id="saveDistribution">

                    Save

                </button>

            </div>

        </div>

    </div>

    <!-- DELETE MODAL -->

    <div class="modal" id="deleteDistributionModal">

        <div class="modal-content small">

            <div class="delete-icon">

                <i class="fa-solid fa-trash"></i>

            </div>

            <h3>
                Delete Distribution?
            </h3>

            <p>
                This action cannot be undone.
            </p>

            <div class="modal-footer">

                <button class="btn-secondary" id="cancelDeleteDistribution">

                    Cancel

                </button>

                <button class="btn-danger" id="confirmDeleteDistribution">

                    Delete

                </button>

            </div>

        </div>

    </div>



    <script src="../components/profile-modal.js"></script>
    <script src="../components/loadAdminSidebar.js"></script>
    <script src="../components/logout-modal.js"></script>
    <script src="../js/admin-distributions.js"></script>

  <script src="../components/back-to-top.js"></script>
</body>

</html>
