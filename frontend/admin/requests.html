<!-- Main structure and layout for requests -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResQMate – Requests</title>

    <link rel="stylesheet" href="../style/customer-sidebar.css">
    <link rel="stylesheet" href="../style/admin-shared.css">
    <link rel="stylesheet" href="../style/logout-modal.css">
    <link rel="stylesheet" href="../style/profile-modal.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <div class="dashboard-container">

        <div id="sidebar-container"></div>
        <div id="logout-modal-wrapper"></div>
        <div id="profile-modal-wrapper"></div>

        <!-- Main Content Section -->
<main class="main-content">

            <div class="topbar">
                <h2>Requests</h2>
                <p>Manage and monitor assistance requests</p>
            </div>

            <!-- Statistics -->

            <div class="stats-grid">

                <div class="stat-card">
                    <h3>Total Requests</h3>
                    <div class="stat-number" id="totalRequests">0</div>
                </div>

                <div class="stat-card">
                    <h3>Pending</h3>
                    <div class="stat-number" id="pendingRequests">0</div>
                </div>

                <div class="stat-card">
                    <h3>Processing</h3>
                    <div class="stat-number" id="processingRequests">0</div>
                </div>

                <div class="stat-card">
                    <h3>Completed</h3>
                    <div class="stat-number" id="completedRequests">0</div>
                </div>

            </div>

            <!-- Requests Table -->

            <div class="table-card">

                <div class="toolbar-row">

                    <h5 class="section-title">
                        Assistance Requests
                    </h5>

                    <div class="toolbar-actions">

                        <div class="search-box">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input type="text" id="requestSearch" placeholder="Search requests...">
                        </div>
                        
                        <select id="provinceFilter" class="rq-input" aria-label="Filter by Province">
                            <option value="all">All Provinces</option>
                            <option value="Metro Manila">Metro Manila</option>
                        </select>
                        
                        <select id="cityFilter" class="rq-input" aria-label="Filter by City">
                            <option value="all">All Cities</option>
                            <option value="Manila">Manila</option>
                            <option value="Quezon City">Quezon City</option>
                            <option value="Makati">Makati</option>
                            <option value="Taguig">Taguig</option>
                            <option value="Pasig">Pasig</option>
                        </select>

                        <select id="statusFilter" class="rq-input" aria-label="Filter selection" title="Filter selection">

                            <option value="all">
                                All Status
                            </option>

                            <option value="pending">
                                Pending
                            </option>

                            <option value="processing">
                                Processing
                            </option>

                            <option value="completed">
                                Completed
                            </option>

                            <option value="rejected">
                                Rejected
                            </option>

                        </select>

                    </div>

                </div>

                <div class="table-responsive">

                    <!-- Data Table Section -->
<table id="requestsTable">

                        <thead>

                            <tr>
                                <th>ID</th>
                                <th>Requester</th>
                                <th>Category</th>
                                <th>Location</th>
                                <th>Priority</th>
                                <th>Status</th>
                                <th>Assigned Staff</th>
                                <th>Actions</th>
                            </tr>

                        </thead>

                        <tbody id="requestsTableBody">
                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>

    <!-- VIEW REQUEST MODAL -->
    <!-- Modal UI Component -->
<div class="modal" id="viewRequestModal">

        <!-- Modal UI Component -->
<div class="modal-content request-modal-card">

            <!-- Modal UI Component -->
<div class="request-modal-header">

                <div>
                    <h4>Request Details</h4>
                    <p>View assistance request information</p>
                </div>

                <button id="closeViewModal" aria-label="Close Request Details">
                    <i class="fa-solid fa-xmark"></i>
                </button>

            </div>

            <div class="request-details">

                <div class="detail-row">
                    <label>Request ID</label>
                    <span id="modalRequestId"></span>
                </div>

                <div class="detail-row">
                    <label>Requester</label>
                    <span id="modalRequester"></span>
                </div>

                <div class="detail-row">
                    <label>Category</label>
                    <span id="modalCategory"></span>
                </div>

                <div class="detail-row">
                    <label>Location</label>
                    <span id="modalLocation"></span>
                </div>

                <div class="detail-row">
                    <label>Priority</label>
                    <span id="modalPriority"></span>
                </div>

                <div class="detail-row">
                    <label>Status</label>
                    <span id="modalStatus"></span>
                </div>

                <div class="detail-row" id="rejectionReasonRow" style="display: none;">
                    <label>Rejection Reason</label>
                    <span id="modalRejectionReason" style="color: #ef4444; font-weight: 500;"></span>
                </div>

                <div class="detail-row">
                    <label>Description</label>

                    <div class="detail-description" id="modalDescription">
                    </div>
                </div>

            </div>

        </div>

    </div>
    <!-- REJECTION MODAL -->
    <!-- Modal UI Component -->
<div class="modal" id="rejectionModal">
        <!-- Modal UI Component -->
<div class="modal-content request-modal-card" style="max-width: 400px;">
            <!-- Modal UI Component -->
<div class="request-modal-header">
                <div>
                    <h4>Reject</h4>
                    <p>Select a reason for rejection</p>
                </div>
                <button id="closeRejectionModal" aria-label="Close Rejection Modal">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="request-details" style="padding: 20px;">
                <form id="rejectionForm">
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label for="rejectionReasonSelect" style="display:block; margin-bottom: 5px; font-weight:500;">Rejection Reason</label>
                        <select id="rejectionReasonSelect" class="rq-input" required style="width: 100%; padding: 10px;">
                            <option value="" disabled selected>Select a reason...</option>
                            <option value="Invalid Location">Invalid Location</option>
                            <option value="Duplicate Request">Duplicate Request</option>
                            <option value="Spam/Fake Request">Spam/Fake Request</option>
                            <option value="Incomplete Documentation">Incomplete Documentation</option>
                            <option value="Others">Others (Please specify)</option>
                        </select>
                    </div>
                    <div class="form-group" id="otherReasonContainer" style="display: none; margin-bottom: 15px;">
                        <label for="otherRejectionReason" style="display:block; margin-bottom: 5px; font-weight:500;">Specify Reason</label>
                        <input type="text" id="otherRejectionReason" class="rq-input" placeholder="Enter reason here..." style="width: 100%; padding: 10px;">
                    </div>
                    <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                        <button type="button" class="btn-secondary" id="cancelRejectionBtn" style="padding: 8px 16px; border-radius: 6px; border: none; background: #e2e8f0; cursor: pointer;">Cancel</button>
                        <button type="submit" class="rq-btn-reject" id="submitRejectionBtn" style="padding: 8px 16px; border-radius: 6px; border: none; background: #ef4444; color: white; cursor: pointer;">Reject</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    </div>

    <script src="../components/loadAdminSidebar.js"></script>
    <script src="../components/logout-modal.js"></script>
    <script src="../js/admin-requests.js"></script>
    <script src="../components/profile-modal.js"></script>

</body>

</html>
