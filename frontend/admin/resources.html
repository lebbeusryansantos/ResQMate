<!-- Main structure and layout for resources -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResQMate – Resources</title>
  <link rel="stylesheet" href="../style/customer-sidebar.css">
  <link rel="stylesheet" href="../style/admin-shared.css">
  <link rel="stylesheet" href="../style/logout-modal.css">
  <link rel="stylesheet" href="../style/profile-modal.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
  <div class="dashboard-container">
    <div id="sidebar-container"></div>
    <div id="logout-modal-wrapper"></div>
    <div id="profile-modal-wrapper"></div>
    <!-- Main Content Section -->
<main class="main-content">

      <div class="topbar">
        <h2>Resources</h2>
        <p>Manage relief resources and inventory</p>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <h3>Total Resources</h3>
          <div class="stat-number" id="totalResources">0</div>
        </div>
        <div class="stat-card">
          <h3>Available Resources</h3>
          <div class="stat-number" id="availableResources">0</div>
        </div>
        <div class="stat-card">
          <h3>Low Stock Resources</h3>
          <div class="stat-number" id="lowStockResources">0</div>
        </div>
        <div class="stat-card">
          <h3>Depleted Resources</h3>
          <div class="stat-number" id="depletedResources">0</div>
        </div>
      </div>

      <div class="table-card">
        <div class="toolbar-row">
          <h5 class="section-title">Resource Inventory</h5>
          <div class="toolbar-actions">
            <div class="search-box">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input type="text" id="resourceSearch" placeholder="Search resources...">
            </div>
            <select id="categoryFilter" class="rq-input" aria-label="Filter by Category">
              <option value="all">All Categories</option>
              <option value="food">Food</option>
              <option value="water">Water</option>
              <option value="shelter">Shelter</option>
              <option value="medicine">Medicine</option>
              <option value="general">General</option>
            </select>
            <button class="btn-primary" id="addResourceBtn">
              <i class="fa-solid fa-plus"></i> Add Resource
            </button>
          </div>
        </div>

        <div class="table-responsive">
          <!-- Data Table Section -->
<table id="resourcesTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>Resource</th>
                <th>Category</th>
                <th>Stock</th>
                <th>Capacity</th>
                <th>Location</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody><!-- Loaded by admin-resources.js --></tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <!-- ADD/EDIT RESOURCE MODAL -->
  <!-- Modal UI Component -->
<div class="modal" id="resourceModal">
    <!-- Modal UI Component -->
<div class="modal-content">
      <!-- Modal UI Component -->
<div class="modal-header">
        <h3 id="modalTitle">Add Resource</h3>
        <button id="closeModal" aria-label="Close Modal"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="resourceForm">

        <div class="form-group">
          <label for="resourceName">
            Resource Name
            <span class="required-asterisk">*</span>
          </label>
          <input type="text" id="resourceName" placeholder="e.g. Relief Food Packs" required>
        </div>

        <div class="form-group">
          <label for="resourceCategory">Category</label>
          <select id="resourceCategory">
            <option value="Food">Food</option>
            <option value="Water">Water</option>
            <option value="Shelter">Shelter</option>
            <option value="Medicine">Medicine</option>
            <option value="General">General</option>
          </select>
        </div>

        <div class="form-group">
          <label>Current Stock</label>
          <input type="number" id="currentStock" readonly value="0">
        </div>

        <div class="form-group">
          <label>Add Stock</label>
          <input type="number" id="addStock" value="0" min="0">
        </div>

        <div class="form-group">
          <label>Maximum Capacity</label>
          <input type="number" id="resourceMaxStock" value="100" min="1" required>
        </div>

        <div class="form-group">
          <label for="resourceUnit">Unit</label>

          <select id="resourceUnit">
            <option value="pcs">Pieces (pcs)</option>
            <option value="box">Box</option>
            <option value="pack">Pack</option>
            <option value="gallon">Gallon</option>
            <option value="liter">Liter</option>
            <option value="sack">Sack</option>
            <option value="kit">Kit</option>
            <option value="other">Other</option>
          </select>

          <input type="text" id="customUnit" placeholder="Enter custom unit" style="display:none; margin-top:8px;">
        </div>

        <div class="form-group">
          <label for="resourceLocation">Location</label>

          <select id="resourceLocation">
            <option value="QC Warehouse">QC Warehouse</option>
            <option value="Pasig Hub">Pasig Hub</option>
            <option value="Marikina Depot">Marikina Depot</option>
            <option value="other">Other</option>
          </select>

          <input type="text" id="customLocation" placeholder="Enter location" class="custom-location-input"
            style="display:none; margin-top:8px;">
        </div>

        <!-- Modal UI Component -->
<div class="modal-footer">
          <button type="button" class="btn-secondary" id="cancelModal">
            Cancel
          </button>

          <button type="submit" class="btn-primary">
            Save Resource
          </button>
        </div>

      </form>
    </div>
  </div>

  <!-- DELETE CONFIRMATION MODAL -->
  <!-- Modal UI Component -->
<div class="modal" id="deleteModal">
    <!-- Modal UI Component -->
<div class="modal-content small">
      <div class="delete-icon"><i class="fa-solid fa-trash"></i></div>
      <h3>Delete Resource?</h3>
      <p>This action cannot be undone.</p>
      <!-- Modal UI Component -->
<div class="modal-footer">
        <button type="button" class="btn-secondary" id="cancelDelete">Cancel</button>
        <button type="button" class="btn-danger" id="confirmDelete">Delete</button>
      </div>
    </div>
  </div>

  <script src="../components/loadAdminSidebar.js"></script>
  <script src="../components/logout-modal.js"></script>
  <script src="../components/profile-modal.js"></script>
  <script src="../js/admin-resources.js"></script>
</body>

</html>
