<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResQMate – Users</title>

  <link rel="stylesheet" href="../style/customer-sidebar.css">
  <link rel="stylesheet" href="../style/admin-shared.css">
  <link rel="stylesheet" href="../style/logout-modal.css">
  <link rel="stylesheet" href="../style/profile-modal.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

  <div class="dashboard-container">

    <div id="sidebar-container"></div>
    <div id="logout-modal-wrapper"></div>
    <div id="profile-modal-wrapper"></div>

    <main class="main-content">

      <div class="topbar">
        <h2>User Management</h2>
        <p>View and manage registered ResQMate user accounts</p>
      </div>

      <div class="table-card">

        <div class="toolbar-row">

          <h5 class="table-title">
            All Users
          </h5>

          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>

            <input type="text" id="userSearch" placeholder="Search users...">
          </div>

          <select id="roleFilter" class="rq-input role-filter" aria-label="Filter users by role">

            <option value="all">
              All Roles
            </option>
            

            <option value="admin">
              Admin
            </option>

            <option value="staff">
              Staff
            </option>

            <option value="community_user">
              User
            </option>

          </select>

          <select id="rowsPerPage" class="rq-input rows-filter" aria-label="Rows per page" style="max-width: 120px;">
            <option value="10">10 Rows</option>
            <option value="25">25 Rows</option>
            <option value="50">50 Rows</option>
          </select>
          <button class="btn-primary" id="addUserBtn">

            <i class="fa-solid fa-user-plus"></i>
            Add User

          </button>

        </div>

        <div class="table-responsive">

          <table id="usersTable">

            <thead>

              <tr>
                <th>User ID</th>
                <th>Full Name</th>
                <th>Email</th>
                <th>Phone Number</th>
                <th>Role</th>
                <th>Actions</th>
              </tr>

            </thead>

            <tbody id="usersTableBody">

              <!-- Loaded by admin-users.js -->

            </tbody>

          </table>

        </div>
                <div class="pagination-controls" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-top: 1px solid #e5e7eb;">
                    <button id="prevPageBtn" class="rq-btn-reject disabled-btn" style="background: #e5e7eb; color: #4b5563; border: none; padding: 8px 16px; border-radius: 6px; cursor: not-allowed;" disabled>Previous</button>
                    <span id="pageIndicator" style="font-size: 0.9rem; color: #4b5563; font-weight: 500;">Page 1</span>
                    <button id="nextPageBtn" class="rq-btn-approve" style="background: #e5e7eb; color: #4b5563; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;">Next</button>
                </div>


        <div id="emptyUsersMessage" class="empty-state d-none">

          <i class="fa-solid fa-users-slash"></i>

          <p>
            No data yet
          </p>

        </div>

      </div>

      <button id="backToTopBtn" title="Go to top"><i class="fa-solid fa-arrow-up"></i></button>
    </main>

  </div>

  <!-- ADD / EDIT USER MODAL -->

  <div class="modal-overlay" id="userModal">

    <div class="modal-box">

      <div class="modal-header-row">

        <h4 id="userModalTitle">
          Add User
        </h4>

        <button class="modal-close-btn" id="closeUserModal" aria-label="Close modal">

          <i class="fa-solid fa-times"></i>

        </button>

      </div>

      <div class="form-group">

        <label>
          First Name
        </label>

        <input type="text" id="userFirstName" placeholder="Enter first name">

      </div>

      <div class="form-group">

        <label>
          Last Name
        </label>

        <input type="text" id="userLastName" placeholder="Enter last name">

      </div>

      <div class="form-group">

        <label>
          Email
        </label>

        <input type="email" id="userEmail" placeholder="Enter email">

      </div>

      <div class="form-group">
        <label>
          Phone Number
        </label>
        <input type="text" id="userPhone" placeholder="Enter phone number">
      </div>

      <div class="form-group">
        <label>
          Emergency Contact Name
        </label>
        <input type="text" id="userEmergencyContactName" placeholder="Enter emergency contact name">
      </div>

      <div class="form-group">
        <label>
          Emergency Contact Number
        </label>
        <input type="text" id="userEmergencyContactNumber" placeholder="Enter emergency contact number">
      </div>

      <div class="form-group">
        <label>
          Date of Birth / Age
        </label>
        <div style="display: flex; gap: 10px; align-items: center;">
          <input type="date" id="userDob" style="flex: 1;">
          <span id="userCalculatedAge" style="font-weight: 500; color: #4b5563; min-width: 60px;">Age: --</span>
        </div>
      </div>

      <div class="form-group">

        <label>
          Role
        </label>

        <select id="userRole" aria-label="User role">

          <option value="community_user">
            Community User
          </option>

          <option value="staff">
            Staff
          </option>

          <option value="admin">
            Admin
          </option>


        </select>

      </div>

      <div class="form-group" id="passwordGroup">

        <label>
          Password
        </label>

        <input type="password" id="userPassword" placeholder="Enter password">

      </div>

      <div class="modal-footer">

        <button class="btn-secondary" id="cancelUserModal">

          Cancel

        </button>

        <button class="btn-primary" id="saveUserBtn">

          Save User

        </button>

      </div>

    </div>

  </div>

  <script src="../components/loadAdminSidebar.js"></script>
  <script src="../components/logout-modal.js"></script>
  <script src="../components/profile-modal.js"></script>

  <!-- USERS CRUD -->
  <script src="../js/admin-users.js"></script>

  <script src="../components/back-to-top.js"></script>
</body>

</html>
