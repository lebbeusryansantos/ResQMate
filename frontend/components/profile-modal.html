<div class="modal" id="profileModal">
    <div class="modal-overlay-bg" id="profileModalOverlay"></div>
    <div class="modal-content">

        <div class="profile-modal-body">

            <div class="profile-avatar-large" id="modalAvatar">
                A
            </div>

            <div class="profile-user-info">

                <h5 id="modalName">
                    Loading...
                </h5>

                <p id="modalRole">
                    Loading...
                </p>

            </div>

            <div class="profile-details">

                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" id="profileFirstName" readonly>
                </div>

                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" id="profileLastName" readonly>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="profileEmail" readonly>
                </div>

                <div class="form-group">
                    <label>Role</label>
                    <input type="text" id="profileRoleInput" readonly>
                </div>

                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="profilePassword" placeholder="Keep blank to keep current password">
                </div>

            </div>

            <div class="profile-modal-footer">

                <button class="btn-secondary" id="closeProfileModal">
                    Cancel
                </button>

                <button class="btn-primary" id="saveProfileBtn">
                    Update Password
                </button>

            </div>

        </div>

    </div>
</div>
