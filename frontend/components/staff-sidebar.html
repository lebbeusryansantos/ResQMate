<!-- Main structure and layout for staff-sidebar -->
<aside class="sidebar">
    <div class="sidebar-header-wrapper"
        style="display: flex; align-items: center; justify-content: space-between; padding-right: 4px;">
        <div class="logo" style="padding: 15px 10px; margin-bottom: 10px;">
            <img src="../assets/logo.png" alt="ResQMate Logo">
            <h2>ResQMate</h2>
        </div>
        <button class="toggle-btn" aria-label="Toggle Sidebar"
            style="background: transparent; border: none; font-size: 1.1rem; cursor: pointer; padding: 8px; border-radius: 8px;">
            <i class="fa-solid fa-bars"></i>
        </button>
    </div>

    <ul class="menu">
        <li>
            <a href="../staff/dashboard.html">
                <i class="fa-solid fa-house"></i>
                <span>Dashboard</span>
            </a>
        </li>
        <li>
            <a href="../staff/requests.html">
                <i class="fa-solid fa-file-lines"></i>
                <span>Requests</span>
            </a>
        </li>
        <li>
            <a href="../staff/distributions.html">
                <i class="fa-solid fa-truck"></i>
                <span>Distributions</span>
            </a>
        </li>
    </ul>

    <!-- Bottom Section -->
    <div class="sidebar-bottom">
        <div class="sidebar-footer-row">
            <button class="profile-button">
                <div class="profile-avatar" id="profileAvatar">S</div>
                <div class="profile-info">
                    <!-- Filled by loadStaffSidebar.js from localStorage -->
                    <strong id="profileName">—</strong>
                    <span id="profileRole">RELIEF STAFF</span>
                </div>
            </button>
            <div class="logout">
                <button title="Logout">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </button>
            </div>
        </div>
    </div>
</aside>
