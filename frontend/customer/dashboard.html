<!-- Main structure and layout for dashboard -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="stylesheet" href="../style/customer-sidebar.css">
    <link rel="stylesheet" href="../style/customer-dashboard.css">
    <link rel="stylesheet" href="../style/logout-modal.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body>

    <div class="dashboard-container">
        <!-- Standalone Sidebar Placeholder -->
        <div id="sidebar-container"></div>

        <!-- Main Content Area -->
        <!-- Main Content Section -->
<main class="main-content">

            <!-- Page Title -->
            <div class="content-title">
                <h2>Dashboard</h2>
            </div>

            <!-- Summary Cards Grid -->
            <div class="stats-grid">
                <div class="stat-card blue">
                    <div class="stat-card-icon"><i class="fa-solid fa-box-archive"></i></div>
                    <div class="stat-card-info">
                        <h3>My Pending Requests</h3>
                        <div class="stat-number" id="pendingCount">0</div>
                    </div>
                </div>

                <div class="stat-card green">
                    <div class="stat-card-icon"><i class="fa-solid fa-circle-check"></i></div>
                    <div class="stat-card-info">
                        <h3>Approved Requests</h3>
                        <div class="stat-number" id="approvedCount">0</div>
                    </div>
                </div>

                <div class="stat-card grey">
                    <div class="stat-card-icon"><i class="fa-solid fa-circle-check"></i></div>
                    <div class="stat-card-info">
                        <h3>Completed Requests</h3>
                        <div class="stat-number" id="completedCount">0</div>
                    </div>
                </div>

                <a href="notification.html" class="stat-card purple latest-updates-card">
                    <div class="stat-card-icon">
                        <i class="fa-solid fa-bullhorn"></i>
                    </div>
                    <div class="stat-card-info">
                        <h3>Latest Updates</h3>
                    </div>
                </a>
            </div>

            <!-- Recent Requests Table Section -->
            <div class="recent-requests-section">
                <div class="section-header">
                    <h3>Recent Requests</h3>
                </div>

                <div class="table-responsive">
                    <!-- Data Table Section -->
<table class="requests-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Type</th>
                                <th>Status</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody id="recentRequestsBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div id="logout-modal-wrapper"></div>
        <div id="profile-modal-wrapper"></div>

    <!-- Script to inject the sidebar component -->
    <script src="../js/customer-dashboard.js"></script>
    <script src="../components/loadSidebar.js"></script>
    <script src="../components/profile-modal.js"></script>
    <script src="../components/logout-modal.js"></script>
</body>

</html>
