<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="stylesheet" href="../style/customer-sidebar.css">
    <link rel="stylesheet" href="../style/customer-dashboard.css">
    <link rel="stylesheet" href="../style/logout-modal.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body>

    <div class="dashboard-container">
        <!-- Standalone Sidebar Placeholder -->
        <div id="sidebar-container"></div>
        <div id="logout-modal-wrapper"></div>
        <div id="profile-modal-wrapper"></div>

        <!-- Main Content Area -->
        <main class="main-content">

            <!-- Page Title -->
            <div class="content-title">
                <h2>Dashboard</h2>
            </div>

            <!-- Summary Cards Grid -->
            <div class="stats-grid">
                <div class="stat-card blue">
                    <div class="stat-card-icon"><i class="fa-solid fa-box-archive"></i></div>
                    <div class="stat-card-info">
                        <h3>My Pending Requests</h3>
                        <div class="stat-number" id="pendingCount">0</div>
                    </div>
                </div>

                <div class="stat-card orange">
                    <div class="stat-card-icon"><i class="fa-solid fa-circle-check"></i></div>
                    <div class="stat-card-info">
                        <h3>Processing Requests</h3>
                        <div class="stat-number" id="processingCount">0</div>
                    </div>
                </div>

                <div class="stat-card green">
                    <div class="stat-card-icon"><i class="fa-solid fa-circle-check"></i></div>
                    <div class="stat-card-info">
                        <h3>Completed Requests</h3>
                        <div class="stat-number" id="completedCount">0</div>
                    </div>
                </div>

                <div class="stat-card red">
                    <div class="stat-card-icon"><i class="fa-solid fa-circle-xmark"></i></div>
                    <div class="stat-card-info">
                        <h3>Rejected Requests</h3>
                        <div class="stat-number" id="rejectedCount">0</div>
                    </div>
                </div>

                <div class="stat-card grey">
                    <div class="stat-card-icon"><i class="fa-solid fa-ban"></i></div>
                    <div class="stat-card-info">
                        <h3>Cancelled Requests</h3>
                        <div class="stat-number" id="cancelledCount">0</div>
                    </div>
                </div>

                <a href="notification.html" class="stat-card purple latest-updates-card">
                    <div class="stat-card-icon">
                        <i class="fa-solid fa-bullhorn"></i>
                    </div>
                    <div class="stat-card-info">
                        <h3>Latest Updates</h3>
                    </div>
                </a>
            </div>

            <!-- Recent Requests Table Section -->
            <div class="recent-requests-section">
                <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
                    <h3 style="margin: 0;">Recent Requests</h3>
                    <div class="toolbar-actions" style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                        <input type="text" id="searchRequests" placeholder="Search by ID or Type..." class="search-input" style="padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; outline: none; width: 200px;">
                        <select id="statusFilter" class="filter-dropdown" style="padding: 8px; border-radius: 6px; border: 1px solid #ddd;">
                            <option value="all">All Statuses</option>
                            <option value="pending">Pending</option>
                            <option value="processing">Processing</option>
                            <option value="completed">Completed</option>
                            <option value="rejected">Rejected</option>
                            <option value="cancelled">Cancelled</option>
                        </select>
                        <select id="rowsPerPage" class="filter-dropdown" style="padding: 8px; border-radius: 6px; border: 1px solid #ddd;">
                            <option value="10">10 Rows per page</option>
                            <option value="25">25 Rows per page</option>
                            <option value="50">50 Rows per page</option>
                            <option value="100">100 Rows per page</option>
                        </select>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="requests-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Type</th>
                                <th>Status</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody id="recentRequestsBody">
                        </tbody>
                    </table>
                </div>
                <div class="pagination-controls" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-top: 1px solid #e5e7eb;">
                    <span id="pageIndicator" style="font-size: 0.9rem; color: #4b5563; font-weight: 500;">Showing 0 to 0 of 0 entries</span>
                    <div style="display: flex; gap: 10px;">
                        <button id="prevPageBtn" class="rq-btn-reject disabled-btn" style="background: #e5e7eb; color: #4b5563; border: none; padding: 8px 16px; border-radius: 6px; cursor: not-allowed;" disabled>Previous</button>
                        <button id="nextPageBtn" class="rq-btn-approve" style="background: #e5e7eb; color: #4b5563; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;">Next</button>
                    </div>
                </div>

            </div>
          <button id="backToTopBtn" title="Go to top"><i class="fa-solid fa-arrow-up"></i></button>
    </main>
    </div>

    <!-- Script to inject the sidebar component -->
    <script src="../js/customer-dashboard.js"></script>
    <script src="../components/loadSidebar.js"></script>
    <script src="../components/profile-modal.js"></script>
    <script src="../components/logout-modal.js"></script>
  <script src="../components/back-to-top.js"></script>
</body>

</html>
