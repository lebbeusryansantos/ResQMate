<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResQMate - Request Assistance</title>

    <link rel="stylesheet" href="../style/customer-sidebar.css">
    <link rel="stylesheet" href="../style/customer-request.css">
    <link rel="stylesheet" href="../style/logout-modal.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <div class="dashboard-container">

        <div id="sidebar-container"></div>
        <div id="logout-modal-wrapper"></div>
        <div id="profile-modal-wrapper"></div>

        <main class="main-content">

            <div class="content-title">
                <h2>Request Assistance</h2>
                <p>Submit a new request for relief aid or resources.</p>
            </div>

            <div class="request-card">

                <div id="requestError" class="error-alert d-none"></div>

                <form id="requestForm" novalidate>

                    <div class="form-section">

                        <label class="form-label">
                            Assistance Type <span>*</span>
                        </label>

                        <div class="assistance-types">

                            <button type="button" class="assistance-option" data-type="Food">
                                <div class="option-icon">
                                    <i class="fa-solid fa-utensils"></i>
                                </div>
                                <div class="option-name">Food</div>
                                <div class="cart-inputs" style="display: none; margin-top: 10px; width: 90%;">
                                    <input type="number" class="cart-qty rq-input" min="1" value="1" style="width: 100%; margin-bottom: 5px; padding: 4px; text-align: center; border: 1px solid #ccc; border-radius: 4px;" onclick="event.stopPropagation();">
                                    <select class="cart-unit rq-input" style="width: 100%; padding: 4px; border: 1px solid #ccc; border-radius: 4px;" onclick="event.stopPropagation();">
                                        <option value="Boxes">Boxes</option>
                                        <option value="Cans">Cans</option>
                                        <option value="Bundles">Bundles</option>
                                        <option value="Packs">Packs</option>
                                        <option value="Pieces">Pieces</option>
                                    </select>
                                </div>
                            </button>

                            <button type="button" class="assistance-option" data-type="Water">
                                <div class="option-icon">
                                    <i class="fa-solid fa-droplet"></i>
                                </div>
                                <div class="option-name">Water</div>
                                <div class="cart-inputs" style="display: none; margin-top: 10px; width: 90%;">
                                    <input type="number" class="cart-qty rq-input" min="1" value="1" style="width: 100%; margin-bottom: 5px; padding: 4px; text-align: center; border: 1px solid #ccc; border-radius: 4px;" onclick="event.stopPropagation();">
                                    <select class="cart-unit rq-input" style="width: 100%; padding: 4px; border: 1px solid #ccc; border-radius: 4px;" onclick="event.stopPropagation();">
                                        <option value="Bottles">Bottles</option>
                                        <option value="Gallons">Gallons</option>
                                        <option value="Boxes">Boxes</option>
                                    </select>
                                </div>
                            </button>

                            <button type="button" class="assistance-option" data-type="Shelter">
                                <div class="option-icon">
                                    <i class="fa-solid fa-house"></i>
                                </div>
                                <div class="option-name">Shelter</div>
                                <div class="cart-inputs" style="display: none; margin-top: 10px; width: 90%;">
                                    <input type="number" class="cart-qty rq-input" min="1" value="1" style="width: 100%; margin-bottom: 5px; padding: 4px; text-align: center; border: 1px solid #ccc; border-radius: 4px;" onclick="event.stopPropagation();">
                                    <select class="cart-unit rq-input" style="width: 100%; padding: 4px; border: 1px solid #ccc; border-radius: 4px;" onclick="event.stopPropagation();">
                                        <option value="Tents">Tents</option>
                                        <option value="Sets">Sets</option>
                                        <option value="Pieces">Pieces</option>
                                    </select>
                                </div>
                            </button>

                            <button type="button" class="assistance-option" data-type="Medicine">
                                <div class="option-icon">
                                    <i class="fa-solid fa-pills"></i>
                                </div>
                                <div class="option-name">Medicine</div>
                                <div class="cart-inputs" style="display: none; margin-top: 10px; width: 90%;">
                                    <input type="number" class="cart-qty rq-input" min="1" value="1" style="width: 100%; margin-bottom: 5px; padding: 4px; text-align: center; border: 1px solid #ccc; border-radius: 4px;" onclick="event.stopPropagation();">
                                    <select class="cart-unit rq-input" style="width: 100%; padding: 4px; border: 1px solid #ccc; border-radius: 4px;" onclick="event.stopPropagation();">
                                        <option value="Packs">Packs</option>
                                        <option value="Boxes">Boxes</option>
                                        <option value="Bottles">Bottles</option>
                                        <option value="Pieces">Pieces</option>
                                    </select>
                                </div>
                            </button>

                            <button type="button" class="assistance-option" data-type="General">
                                <div class="option-icon">
                                    <i class="fa-solid fa-hand-holding-heart"></i>
                                </div>
                                <div class="option-name">General</div>
                                <div class="cart-inputs" style="display: none; margin-top: 10px; width: 90%;">
                                    <input type="number" class="cart-qty rq-input" min="1" value="1" style="width: 100%; margin-bottom: 5px; padding: 4px; text-align: center; border: 1px solid #ccc; border-radius: 4px;" onclick="event.stopPropagation();">
                                    <select class="cart-unit rq-input" style="width: 100%; padding: 4px; border: 1px solid #ccc; border-radius: 4px;" onclick="event.stopPropagation();">
                                        <option value="Boxes">Boxes</option>
                                        <option value="Bundles">Bundles</option>
                                        <option value="Sets">Sets</option>
                                    </select>
                                </div>
                            </button>

                        </div>

                        <input type="hidden" id="assistanceType" name="assistance_type" value="Multiple">

                    </div>

                    <div class="form-section">

                        <label class="form-label">
                            Location <span>*</span>
                        </label>
                        <p id="locationHelperText" style="font-size: 0.85rem; color: #6b7280; margin-bottom: 10px;">(Please select at least one assistance item to unlock the next steps)</p>

                        <div class="location-fields">

                            <select id="region" title="Region" aria-label="Region" class="form-select" required disabled>
                                <option value="">Select Region</option>
                            </select>

                            <select id="province" title="Province" aria-label="Province" class="form-select" required disabled>
                                <option value="">Select Province</option>
                            </select>

                            <select id="city" title="City/Municipality" aria-label="City/Municipality" class="form-select" required disabled>
                                <option value="">Select City</option>
                            </select>

                            <select id="barangay" title="Barangay" aria-label="Barangay" class="form-select" required disabled>
                                <option value="">Select Barangay</option>
                            </select>
                            
                            <textarea minlength="30" id="specificAddress" title="Specific Address" class="form-textarea address-input" placeholder="Specific Address (e.g., 123 Main St)" required disabled></textarea>
<small class="char-counter text-muted" style="display:block; margin-top:4px; font-size:0.8rem; color:#6c757d;">0/30 minimum characters</small>
                            
                            <textarea minlength="30" id="landmark" title="Landmark" class="form-textarea landmark-input" placeholder="Landmark (e.g., near Plaza)" disabled></textarea>
<small class="char-counter text-muted" style="display:block; margin-top:4px; font-size:0.8rem; color:#6c757d;">0/30 minimum characters</small>

                        </div>

                    </div>

                    <div class="form-section">

                        <label for="calamityType" class="form-label">
                            Calamity Type <span>*</span>
                        </label>

                        <select id="calamityType" name="calamity_type" class="form-select" required disabled>
                            <option value="">Select Calamity Type</option>
                            <option value="Typhoon">Typhoon</option>
                            <option value="Earthquake">Earthquake</option>
                            <option value="Flood">Flood</option>
                            <option value="Fire">Fire</option>
                            <option value="Others">Others</option>
                        </select>

                    </div>

                    <div class="form-section">

                        <label for="details" class="form-label">
                            Details <span>*</span>
                        </label>

                        <textarea id="details" name="details" class="form-textarea" maxlength="1000" minlength="30"
                            placeholder="Tell us more about your situation..." required disabled></textarea>
<small class="char-counter text-muted" style="display:block; margin-top:4px; font-size:0.8rem; color:#6c757d;">0/30 minimum characters</small>

                        <div class="character-counter">
                            <span id="detailsHelperText" style="float: left; color: #ef4444;">Minimum 30 characters required</span>
                            <span id="characterCount">0</span>/1000
                        </div>

                    </div>

                    <div class="form-section">

                        <label for="priority" class="form-label">
                            Priority Level <span>*</span>
                        </label>

                        <select id="priority" name="priority" class="form-select" required disabled>

                            <option value="" disabled selected>Select Priority Level</option>
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>

                        </select>

                    </div>

                    <div class="confirmation-section">
                        <label class="confirmation-label">
                            <input type="checkbox" id="confirmationCheckbox" disabled>
                            I confirm that the information provided is accurate, and I understand that submitting false or exaggerated emergency requests may lead to account suspension.
                        </label>
                    </div>

                    <div class="form-buttons">

                        <button type="reset" class="cancel-button" id="cancelButton">
                            Clear Form
                        </button>

                        <button type="submit" class="submit-button" disabled>
                            Submit Request
                        </button>

                    </div>

                </form>

            </div>

          <button id="backToTopBtn" title="Go to top"><i class="fa-solid fa-arrow-up"></i></button>
    </main>

    <script src="../js/customer-request.js"></script>
    <script src="../js/location-dropdown.js"></script>
    <script src="../components/loadSidebar.js"></script>
    <script src="../components/profile-modal.js"></script>
    <script src="../components/logout-modal.js"></script>

  <script src="../components/back-to-top.js"></script>
  <script src="../js/textarea-validation.js"></script>
</body>

</html>
