<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResQMate - Request Assistance</title>

    <link rel="stylesheet" href="../style/customer-sidebar.css">
    <link rel="stylesheet" href="../style/customer-request.css">
    <link rel="stylesheet" href="../style/logout-modal.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <div class="dashboard-container">

        <div id="sidebar-container"></div>

        <main class="main-content">

            <div class="content-title">
                <h2>Request Assistance</h2>
                <p>Submit a new request for relief aid or resources.</p>
            </div>

            <div class="request-card">

                <div id="requestError" class="error-alert d-none"></div>

                <form id="requestForm" novalidate>

                    <div class="form-section">

                        <label class="form-label">
                            Assistance Type <span>*</span>
                        </label>

                        <div class="assistance-types">

                            <button type="button" class="assistance-option active" data-type="Food">
                                <div class="option-icon">
                                    <i class="fa-solid fa-utensils"></i>
                                </div>
                                <div class="option-name">Food</div>
                            </button>

                            <button type="button" class="assistance-option" data-type="Water">
                                <div class="option-icon">
                                    <i class="fa-solid fa-droplet"></i>
                                </div>
                                <div class="option-name">Water</div>
                            </button>

                            <button type="button" class="assistance-option" data-type="Shelter">
                                <div class="option-icon">
                                    <i class="fa-solid fa-house"></i>
                                </div>
                                <div class="option-name">Shelter</div>
                            </button>

                            <button type="button" class="assistance-option" data-type="Medicine">
                                <div class="option-icon">
                                    <i class="fa-solid fa-pills"></i>
                                </div>
                                <div class="option-name">Medicine</div>
                            </button>

                            <button type="button" class="assistance-option" data-type="Other">
                                <div class="option-icon">
                                    <i class="fa-solid fa-hand-holding-heart"></i>
                                </div>
                                <div class="option-name">Other</div>
                            </button>

                        </div>

                        <input type="hidden" id="assistanceType" name="assistance_type" value="Food">

                    </div>

                    <div class="form-section">

                        <label class="form-label">
                            Location <span>*</span>
                        </label>

                        <div class="location-fields">

                            <select id="region" title="Region" aria-label="Region" class="form-select" required>
                                <option value="">Select Region</option>
                            </select>

                            <select id="province" title="Province" aria-label="Province" class="form-select" required>
                                <option value="">Select Province</option>
                            </select>

                            <select id="city" title="City/Municipality" aria-label="City/Municipality" class="form-select" required>
                                <option value="">Select City</option>
                            </select>

                            <select id="barangay" title="Barangay" aria-label="Barangay" class="form-select" required>
                                <option value="">Select Barangay</option>
                            </select>

                        </div>

                    </div>

                    <div class="form-section">

                        <label for="details" class="form-label">
                            Details <span>*</span>
                        </label>

                        <textarea id="details" name="details" class="form-textarea" maxlength="1000"
                            placeholder="Tell us more about your situation..." required></textarea>

                        <div class="character-counter">
                            <span id="characterCount">0</span>/1000
                        </div>

                    </div>

                    <div class="form-section">

                        <label for="priority" class="form-label">
                            Priority Level <span>*</span>
                        </label>

                        <select id="priority" name="priority" class="form-select" required>

                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>

                        </select>

                    </div>

                    <div class="form-buttons">

                        <button type="reset" class="cancel-button" id="cancelButton">
                            Clear Form
                        </button>

                        <button type="submit" class="submit-button">
                            Submit Request
                        </button>

                    </div>

                </form>

            </div>

        </main>

    </div>

    <div id="logout-modal-wrapper"></div>
        <div id="profile-modal-wrapper"></div>

    <script src="../js/customer-request.js"></script>
    <script src="../js/location-dropdown.js"></script>
    <script src="../components/loadSidebar.js"></script>
    <script src="../components/profile-modal.js"></script>
    <script src="../components/logout-modal.js"></script>

</body>

</html>
