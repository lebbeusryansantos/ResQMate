<!-- Main structure and layout for requests -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResQMate - My Requests</title>

    <link rel="stylesheet" href="../style/customer-requests.css">
    <link rel="stylesheet" href="../style/customer-sidebar.css">
    <link rel="stylesheet" href="../style/logout-modal.css">
    <link rel="stylesheet" href="../style/shared-modal.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <div class="dashboard-container">
        <!-- Sidebar Container (Loaded via JS) -->
        <div id="sidebar-container"></div>
        <div id="logout-modal-wrapper"></div>
        <div id="profile-modal-wrapper"></div>

        <!-- Main Content -->
        <!-- Main Content Section -->
<main class="main-content">
            <div class="header-title">
                <h1>My Requests</h1>
                <p>Track the status of your assistance requests.</p>
            </div>

            <div class="table-card">
                <!-- Data Table Section -->
<table class="requests-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Type</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="requestsTableBody">
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- View Request Details Modal -->
    <!-- Modal UI Component -->
<div class="custom-modal-overlay" id="viewRequestModal">

        <!-- Modal UI Component -->
<div class="custom-modal">

            <!-- Modal UI Component -->
<div class="modal-header">
                <h3>Request Details</h3>

                <button class="modal-close" id="closeViewModal">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Modal UI Component -->
<div class="modal-body">

                <div class="request-id-badge" id="modalRequestIdBadge">
                    Request ID #--
                </div>

                <!-- CATEGORY + PRIORITY + STATUS -->
                <div class="top-info-row">

                    <div class="info-box">
                        <span class="detail-label">Category</span>
                        <div class="detail-value" id="modalCategory">--</div>
                    </div>

                    <div class="info-box">
                        <span class="detail-label">Priority</span>
                        <div class="detail-value" id="modalPriority">--</div>
                    </div>

                    <div class="info-box">
                        <span class="detail-label">Status</span>
                        <span class="status-badge-modal" id="modalStatusBadge">
                            --
                        </span>
                    </div>

                </div>

                <!-- LOCATION -->
                <div class="location-box">

                    <div class="location-title">
                        Location
                    </div>

                    <div class="location-line">

                        <div class="location-item">
                            <strong>Barangay:</strong>
                            <span id="modalBarangay">--</span>
                        </div>

                        <div class="location-item">
                            <strong>City:</strong>
                            <span id="modalCity">--</span>
                        </div>

                        <div class="location-item">
                            <strong>Province:</strong>
                            <span id="modalProvince">--</span>
                        </div>

                        <div class="location-item">
                            <strong>Region:</strong>
                            <span id="modalRegion">--</span>
                        </div>

                    </div>

                </div>

                <!-- DESCRIPTION -->
                <div class="detail-group">

                    <span class="detail-label">
                        Description
                    </span>

                    <div class="description-box" id="modalDescription">
                        --
                    </div>

                </div>

                <!-- REJECTION REASON -->
                <div class="rejection-box" id="rejectionReasonRow" style="display:none;">

                    <div class="rejection-title">
                        Rejection Reason
                    </div>

                    <div class="rejection-text" id="modalRejectionReason">
                        --
                    </div>

                </div>

            </div>

            <!-- Modal UI Component -->
<div class="modal-footer">

                <button class="modal-btn" id="closeModalButton">
                    Close
                </button>

            </div>

        </div>

    </div>

    <script src="../components/loadSidebar.js"></script>
    <script src="../components/profile-modal.js"></script>
    <script src="../components/logout-modal.js"></script>
    <script src="../js/customer-requests.js"></script>

</body>

</html>
