<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Dashboard</title>

  <link rel="stylesheet" href="../style/customer-sidebar.css">
  <link rel="stylesheet" href="../style/logout-modal.css">
  <link rel="stylesheet" href="../style/profile-modal.css">
  <link rel="stylesheet" href="../style/admin-shared.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

  <div class="dashboard-container">

    <div id="sidebar-container"></div>
    <div id="logout-modal-wrapper"></div>
    <div id="profile-modal-wrapper"></div>

    <main class="main-content">

      <!-- Top Bar -->
      <div class="topbar">
        <div>
          <h2>Staff Dashboard</h2>
          <p>Your assigned requests and relief operations</p>
        </div>
      </div>

      <!-- Statistics -->
      <div class="stats-grid">

        <div class="stat-card">
          <h3>My Assigned</h3>
          <div id="totalRequests" class="stat-number">0</div>
        </div>

        <div class="stat-card">
          <h3>For Delivery</h3>
          <div id="pendingRequests" class="stat-number">0</div>
        </div>

        <div class="stat-card">
          <h3>Completed</h3>
          <div id="completedDistributions" class="stat-number">0</div>
        </div>

        <div class="stat-card">
          <h3>Resources</h3>
          <div id="totalResources" class="stat-number">0</div>
        </div>

      </div>

      <!-- Recent Requests Table -->
      <div class="table-card">
        <h3>My Recent Requests</h3>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Requester</th>
              <th>Priority</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="recentRequestsTable"></tbody>
        </table>
      </div>
                <div class="pagination-controls" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-top: 1px solid #e5e7eb;">
                    <button id="prevPageBtn" class="rq-btn-reject disabled-btn" style="background: #e5e7eb; color: #4b5563; border: none; padding: 8px 16px; border-radius: 6px; cursor: not-allowed;" disabled>Previous</button>
                    <span id="pageIndicator" style="font-size: 0.9rem; color: #4b5563; font-weight: 500;">Page 1</span>
                    <button id="nextPageBtn" class="rq-btn-approve" style="background: #e5e7eb; color: #4b5563; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;">Next</button>
                </div>


      <button id="backToTopBtn" title="Go to top"><i class="fa-solid fa-arrow-up"></i></button>
    </main>

  </div>

  <script src="../components/logout-modal.js"></script>
  <script src="../components/profile-modal.js"></script>
  <script src="../components/loadStaffSidebar.js"></script>
  <script src="../js/staff-dashboard.js"></script>

  <script src="../components/back-to-top.js"></script>
</body>

</html>
