<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Distributions</title>

    <link rel="stylesheet" href="../style/customer-sidebar.css">
    <link rel="stylesheet" href="../style/logout-modal.css">
    <link rel="stylesheet" href="../style/staff-distributions.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="dashboard-container">

        <div id="sidebar-container"></div>

        <main class="main-content">

            <!-- Topbar -->
            <div class="topbar">
                <div>
                    <h2>My Distributions</h2>
                    <p>Resources assigned to you for delivery</p>
                </div>
            </div>

            <!-- Table Card — READ ONLY for staff, admin creates distributions -->
            <div class="table-card">

                <div class="distribution-header">
                    <p class="text-muted small mb-0">
                        <i class="fas fa-info-circle me-1"></i>
                        Distributions are created by the Admin after approving a request.
                        Your job is to deliver the assigned resources and mark them as Completed in the Requests page.
                    </p>
                </div>

                <!-- Search -->
                <div class="distribution-search mt-16">
                    <input type="text" id="searchInput" class="rq-input" placeholder="Search distributions...">
                </div>

                <!-- Message Box -->
                <div id="messageBox"></div>

                <!-- Table -->
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Request</th>
                                <th>Resource</th>
                                <th>Staff Assigned</th>
                                <th>Quantity</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody id="distributionTableBody">
                            <tr>
                                <td colspan="6">Loading distributions...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>

          <button id="backToTopBtn" title="Go to top"><i class="fa-solid fa-arrow-up"></i></button>
    </main>

    </div>

    <div id="logout-modal-wrapper"></div>
        <div id="profile-modal-wrapper"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../components/profile-modal.js"></script>
    <script src="../components/logout-modal.js"></script>
    <script src="../components/loadStaffSidebar.js"></script>
    <script src="../js/staff-distributions.js"></script>

  <script src="../components/back-to-top.js"></script>
</body>

</html>
