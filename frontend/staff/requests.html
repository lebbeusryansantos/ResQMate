<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ResQMate - Staff Requests</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../style/customer-sidebar.css">
  <link rel="stylesheet" href="../style/logout-modal.css">
  <link rel="stylesheet" href="../style/staff-requests.css">
</head>

<body>

  <div class="dashboard-container">

    <div id="sidebar-container"></div>
    <div id="logout-modal-wrapper"></div>
        <div id="profile-modal-wrapper"></div>

    <main class="main-content">

      <!-- Topbar -->
      <div class="rq-topbar">
        <div>
          <h4 class="mb-0 fw-bold">My Assigned Requests</h4>
          <small class="text-muted">Requests assigned to you that need delivery</small>
        </div>
      </div>

      <!-- Stat Cards -->
      <div class="row g-3 mb-4">
        <div class="col-12 col-md-6">
          <div class="rq-stat-card">
            <h6>Processing</h6>
            <h3 id="countProcessing">0</h3>
          </div>
        </div>
        <div class="col-12 col-md-6">
          <div class="rq-stat-card">
            <h6>Completed</h6>
            <h3 id="countCompleted">0</h3>
          </div>
        </div>
        <div class="col-12 col-md-6">
          <div class="rq-stat-card">
            <h6>Total Assigned</h6>
            <h3 id="countTotal">0</h3>
          </div>
        </div>
        <div class="col-12 col-md-6">
          <div class="rq-stat-card">
            <h6>Pending Delivery</h6>
            <h3 id="countPending">0</h3>
          </div>
        </div>
      </div>

      <!-- Filters -->
      <div class="rq-card mb-4">
        <div class="row g-3">
          <div class="col-md-5">
            <input type="text" id="searchBar" class="form-control" placeholder="Search by ID, name, or type...">
          </div>
          <div class="col-md-3">
            <select id="statusFilter" class="form-select" aria-label="Filter requests by status">
              <option value="all">All Statuses</option>
              <option value="processing">Processing</option>
              <option value="completed">Completed</option>
            </select>
          </div>
          <div class="col-md-2">
            <button class="btn btn-primary w-100" id="refreshBtn">
              <i class="fas fa-rotate-right me-1"></i> Refresh
            </button>
          </div>
        </div>
      </div>

      <!-- Requests Table -->
      <div class="rq-card">
        <div class="table-responsive">
          <table class="table align-middle">
            <thead>
              <tr>
                <th>ID</th>
                <th>Requester</th>
                <th>Type</th>
                <th>Location</th>
                <th>Priority</th>
                <th>Resource Assigned</th>
                <th>Status</th>
                <th>Date</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="requestsTableBody">
              <tr>
                <td colspan="9" class="text-center py-4">Loading requests...</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div id="emptyState" class="text-center py-5 d-none">
          <i class="bi bi-inbox fs-1 text-muted"></i>
          <p class="text-muted mt-3">No data yet</p>
        </div>
      </div>

    </main>
  </div>

  <!-- View Request Modal -->
  <div class="custom-modal-overlay" id="requestModal">
    <div class="custom-modal">
      <div class="custom-modal-header">
        <h3>Request Details</h3>
        <button id="closeRequestModal" aria-label="Close request modal"><i class="fas fa-times"></i></button>
      </div>
      <div class="custom-modal-body" id="customRequestDetailBody"></div>
    </div>
  </div>

  <!-- Delivery Documentation Modal -->
  <div class="custom-modal-overlay" id="documentationModal">
    <div class="custom-modal">

      <div class="custom-modal-header">
        <h3>Delivery Documentation</h3>
        <button id="closeDocumentationModal" aria-label="Close Documentation Modal" title="Close Documentation Modal">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <div class="custom-modal-body">

        <input type="hidden" id="documentationRequestId" title="Request ID">

        <div class="mb-3">
          <label for="deliveryRemarks" class="form-label">Delivery Remarks</label>
          <textarea id="deliveryRemarks" class="form-control" rows="4"
            placeholder="Describe delivery details..."></textarea>
        </div>

        <div class="mb-3">
          <label for="deliveryFile" class="form-label">
            Upload Delivery Proof
          </label>

          <input type="file" id="deliveryFile" class="form-control" accept="image/*">
        </div>

        <div class="d-flex justify-content-end gap-2">
          <button class="btn btn-secondary" id="cancelDocumentation">
            Cancel
          </button>

          <button class="btn btn-success" id="submitDocumentation">
            Submit Documentation
          </button>
        </div>

      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../components/profile-modal.js"></script>
    <script src="../components/logout-modal.js"></script>
  <script src="../components/loadStaffSidebar.js"></script>
  <script src="../js/staff-requests.js"></script>
  <script src="../js/app.js"></script>

</body>

</html>
